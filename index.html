<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speel mijn CV — TestCoders</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="stage">
      <div id="game"></div>
      <aside id="panel" hidden aria-live="polite"></aside>
      <div id="toast" hidden></div>
    </main>

    <nav class="topbar" aria-label="Weergave">
      <button id="btn-classic" type="button">Klassiek CV</button>
      <button id="btn-switch" type="button">Ander CV</button>
    </nav>
    <span class="brand">Test<b>Coders</b></span>

    <section id="classic" hidden>
      <button id="btn-close-classic" type="button" class="close">Terug naar de game</button>
      <article id="classic-content"></article>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
