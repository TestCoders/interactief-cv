<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speel mijn CV — TestCoders</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="alternate" type="text/markdown" href="./llms.txt" title="CV's voor AI (llms.txt)" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Test<b>Coders</b> · Speel mijn CV</span>
      <nav>
        <button id="btn-classic" type="button">Klassiek CV</button>
        <a id="btn-md" class="btn" href="./llms.txt" target="_blank" rel="noopener">AI / Markdown</a>
        <button id="btn-switch" type="button">Ander CV</button>
      </nav>
    </header>

    <main id="stage">
      <div id="game"></div>
      <aside id="panel" hidden></aside>
      <div id="toast" hidden></div>
    </main>

    <p class="help">← → / A D lopen · spatie / ↑ / W springen · loop langs de borden om het CV te lezen</p>

    <section id="classic" hidden>
      <button id="btn-close-classic" type="button" class="close">Terug naar de game</button>
      <article id="classic-content"></article>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
