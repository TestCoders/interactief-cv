<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speel mijn CV — TestCoders</title>
    <link rel="icon" href="./brand/testcoders-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=Jersey+10&family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="alternate" type="text/markdown" href="./llms.txt" title="CV's voor AI (llms.txt)" />
  </head>
  <body>
    <main id="stage">
      <div id="game"></div>
      <aside id="panel" hidden aria-live="polite"></aside>
      <div id="hud" hidden></div>
      <div id="titlecard" hidden></div>
      <div id="coach" hidden role="status"></div>
      <div id="toast" hidden></div>
    </main>

    <nav class="topbar" aria-label="Weergave">
      <button id="btn-style" type="button" title="Wissel van gamestijl">Stijl: Retro ⇄</button>
      <button id="btn-classic" type="button">Klassiek CV</button>
      <a id="btn-md" class="btn" href="./llms.txt" target="_blank" rel="noopener">AI / Markdown</a>
      <button id="btn-switch" type="button">Ander CV</button>
      <button id="btn-sound" type="button">Geluid: aan</button>
    </nav>
    <nav id="chapters" aria-label="Snel naar" hidden></nav>
    <img class="brand" src="./brand/testcoders-logo.svg" alt="TestCoders" />

    <section id="classic" hidden>
      <button id="btn-close-classic" type="button" class="close">Terug naar de game</button>
      <article id="classic-content"></article>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
